<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Session bus: any process in the user's own session may request a
       lock (lion-idle, lion-session, the panel's "Lock" menu item, ...).
       Nothing here needs system-bus-style cross-user restriction. -->
  <policy context="default">
    <allow send_destination="os.lionos.Locker"/>
    <allow receive_sender="os.lionos.Locker"/>
  </policy>
</busconfig>
